        // 智慧網址解析器 (解決 Canva 與 Google 簡報內嵌問題)
        function parseEmbedUrl(input) {
            if (!input) return '';
            let raw = input.trim();
            
            // 1. 若貼上 HTML 嵌入碼 (<iframe src="...">)
            const srcMatch = raw.match(/src=["']([^"']+)["']/);
            if (srcMatch && srcMatch[1]) {
                raw = srcMatch[1];
            }
            
            // 2. Canva 網址處理
            if (raw.includes('canva.com/design/')) {
                let cleanUrl = raw.split('?')[0].split('#')[0];
                while (cleanUrl.endsWith('/view')) {
                    cleanUrl = cleanUrl.slice(0, -5);
                }
                return `${cleanUrl}/view?embed`;
            }

            // 3. Google 簡報處理
            if (raw.includes('docs.google.com/presentation/d/')) {
                let baseUrl = raw.split('/edit')[0].split('/view')[0].split('/pub')[0].split('/embed')[0];
                return `${baseUrl}/embed?start=false&loop=false&delayms=3000`;
            }

            // 4. Google 文件處理
            if (raw.includes('docs.google.com/document/d/')) {
                let baseUrl = raw.split('/edit')[0].split('/view')[0].split('/preview')[0];
                return `${baseUrl}/preview`;
            }

            // 5. Google Drive PDF 檔案處理
            if (raw.includes('drive.google.com/file/d/')) {
                let baseUrl = raw.split('/view')[0].split('/edit')[0];
                return `${baseUrl}/preview`;
            }

            return raw;
        }

                                                    </a>
                                                    <button
                                                        onClick={() => setPreviewUrl(parsedMaterialUrl)}
                                                        className="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border border-indigo-200 px-2 py-1 rounded transition flex items-center space-x-1 font-medium"
                                                    >
                                                        <i className="fa-solid fa-expand"></i>
                                                        <span className="hidden sm:inline">全螢幕</span>
                                                    </button>
                                                </div>
                                            </div>

                                            {/* 教師編輯當前頁籤名稱與網址 */}
                                            {currentUser && currentMaterial && (
                                                <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs space-y-2">
                                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                                        <div>
                                                            <label className="font-semibold text-amber-900 block mb-1">頁籤顯示名稱：</label>
                                                            <input
                                                                type="text"
                                                                value={currentMaterial.name}
                                                                onChange={(e) => handleUpdateMaterialTab(mod.id, currentMaterial.id, 'name', e.target.value)}
                                                                className="w-full bg-white border border-amber-300 rounded px-2 py-1 text-slate-700 focus:ring-2 focus:ring-amber-500"
                                                            />
                                                        </div>
                                                        <div className="sm:col-span-2">
                                                            <label className="font-semibold text-amber-900 block mb-1">教材網址 / HTML 嵌入碼：</label>
                                                            <input
                                                                type="text"
                                                                value={currentMaterial.url}
                                                                onChange={(e) => handleUpdateMaterialTab(mod.id, currentMaterial.id, 'url', e.target.value)}
                                                                placeholder="貼上 Canva/Google 簡報網址或 HTML 嵌入碼..."
                                                                className="w-full bg-white border border-amber-300 rounded px-2 py-1 font-mono text-slate-700 focus:ring-2 focus:ring-amber-500"
                                                            />
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            {/* 嵌入框架 */}
                                            <div className="w-full h-[380px] bg-slate-100 rounded-xl overflow-hidden border border-slate-200 shadow-inner relative">
                                                {parsedMaterialUrl ? (
                                                    <iframe
                                                        src={parsedMaterialUrl}
                                                        className="w-full h-full border-0"
                                                        title={currentMaterial.name}
                                                        allowFullScreen
                                                    ></iframe>
                                                ) : (
                                                    <div className="flex items-center justify-center h-full text-slate-400 text-sm">
                                                        尚未設定教材網址
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        {/* 右側：課程說明與任務按鈕 */}
                                        <div className="lg:col-span-5 flex flex-col justify-between space-y-6">
                                            
                                            <div className="space-y-4">
                                                {/* 週說明與表現任務 */}
                                                <div className="space-y-2">
                                                    <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider block">
                                                        <i className="fa-solid fa-bullseye mr-1.5 text-rose-500"></i>週進度課程說明 & 表現任務
                                                    </span>

                                                    {currentUser ? (
                                                        <textarea
                                                            rows="5"
                                                            value={mod.description}
                                                            onChange={(e) => handleUpdateModuleField(mod.id, 'description', e.target.value)}
                                                            className="w-full border border-slate-300 rounded-lg p-3 text-sm leading-relaxed text-slate-700 focus:ring-2 focus:ring-indigo-500 font-sans"
                                                            placeholder="請輸入活動內涵與表現任務..."
                                                        />
                                                    ) : (
                                                        <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm leading-relaxed text-slate-700 whitespace-pre-line shadow-inner">
                                                            {mod.description}
                                                        </div>
                                                    )}
                                                </div>

                                                {/* 學生表現任務按鈕 (點擊直接進入編輯 Modal) */}
                                                <div className="space-y-2">
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-xs font-medium text-slate-600">
                                                            學生表現任務按鈕 {currentUser && <span className="text-indigo-600 text-[11px]">（點擊按鈕可直接修改）</span>}：
                                                        </span>
                                                        {currentUser && (
                                                            <button
                                                                onClick={() => setEditingTaskModal({ moduleId: mod.id, isNew: true, task: { label: '', url: '' } })}
                                                                className="text-xs text-indigo-600 hover:text-indigo-800 font-medium"
                                                            >
                                                                <i className="fa-solid fa-plus mr-1"></i>新增任務按鈕
                                                            </button>
                                                        )}
                                                    </div>

                                                    <div className="flex flex-wrap gap-2">
                                                        {mod.tasks.map((task) => (
                                                            <div key={task.id} className="inline-flex items-center">
                                                                {currentUser ? (
                                                                    <button
                                                                        onClick={() => setEditingTaskModal({ moduleId: mod.id, task, isNew: false })}
                                                                        className="bg-amber-50 hover:bg-amber-100 border border-amber-300 text-amber-900 text-xs font-medium px-3.5 py-2 rounded-lg shadow-sm transition flex items-center space-x-1.5"
                                                                    >
                                                                        <i className="fa-solid fa-pen text-[10px] opacity-70"></i>
                                                                        <span>{task.label}</span>
                                                                    </button>
                                                                ) : (
                                                                    <a
                                                                        href={task.url}
                                                                        target="_blank"
                                                                        rel="noopener noreferrer"
                                                                        className="bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-indigo-700 text-xs font-medium px-3.5 py-2 rounded-lg shadow-sm transition flex items-center space-x-1.5 active:scale-95"
                                                                    >
                                                                        <span>{task.label}</span>
                                                                        <i className="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-70"></i>
                                                                    </a>
                                                                )}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>

                                            {/* 指標區 (VALUE + OECD + 國語文) */}
                                            <div className="border-t border-slate-200 pt-4 space-y-2">
                                                <div className="flex justify-between items-center">
                                                    <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider flex items-center">
                                                        <i className="fa-solid fa-clipboard-check mr-1.5 text-emerald-600"></i>
                                                        VALUE、OECD 與 國語文指標
                                                    </span>
                                                    {currentUser && (
                                                        <button
                                                            onClick={() => setEditingIndicatorModule(mod)}
                                                            className="text-xs text-indigo-600 hover:underline font-medium"
                                                        >
                                                            <i className="fa-solid fa-pen-to-square mr-1"></i>勾選指標
                                                        </button>
                                                    )}
                                                </div>

                                                <div className="flex flex-wrap gap-1.5">
                                                    {mod.indicators.map((indId) => {
                                                        const ind = ALL_INDICATORS.find(p => p.id === indId);
                                                        if (!ind) return null;
                                                        return (
                                                            <button
                                                                key={ind.id}
                                                                onClick={() => setSelectedIndicator(ind)}
                                                                className={`text-xs px-2.5 py-1 rounded-md border font-medium transition cursor-pointer hover:opacity-80 shadow-sm ${ind.tagColor}`}
                                                            >
                                                                <i className="fa-solid fa-circle-info mr-1 text-[10px]"></i>
                                                                {ind.short}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                </section>
                            );
                        })}
                    </main>

                    {}
                    {/* 全螢幕預覽 Modal */}
                    {previewUrl && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-6xl h-[85vh] flex flex-col overflow-hidden shadow-2xl">
                                <div className="bg-slate-800 text-white px-6 py-3 flex justify-between items-center">
                                    <span className="text-sm font-medium"><i className="fa-solid fa-expand mr-2"></i>教材全螢幕預覽視窗</span>
                                    <button onClick={() => setPreviewUrl(null)} className="text-slate-400 hover:text-white text-lg">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                <div className="flex-1 bg-slate-900">
                                    <iframe src={previewUrl} className="w-full h-full border-0" title="Full preview"></iframe>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 任務按鈕編輯 Modal */}
                    {editingTaskModal && (
                        <TaskEditModal
                            task={editingTaskModal.task}
                            isNew={editingTaskModal.isNew}
                            onSave={handleSaveTaskModal}
                            onDelete={handleDeleteTaskModal}
                            onClose={() => setEditingTaskModal(null)}
                        />
                    )}

                    {/* 指標內涵說明 Modal */}
                    {selectedIndicator && (
                        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl relative">
                                <button onClick={() => setSelectedIndicator(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <span className="bg-indigo-100 text-indigo-800 text-xs px-2.5 py-1 rounded font-bold">
                                    {selectedIndicator.category} 指標內涵
                                </span>
                                <h3 className="text-base font-bold text-slate-800">{selectedIndicator.title}</h3>
                                <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm text-slate-700 leading-relaxed whitespace-pre-line">
                                    {selectedIndicator.content}
                                </div>
                                <div className="text-right">
                                    <button onClick={() => setSelectedIndicator(null)} className="bg-slate-800 text-white text-xs px-4 py-2 rounded-lg">
                                        關閉說明
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 勾選指標 Modal */}
                    {editingIndicatorModule && (
                        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-2xl w-full p-6 space-y-4 shadow-2xl max-h-[85vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="font-bold text-slate-800">勾選 VALUE、OECD 與 國語文指標 - {editingIndicatorModule.weekTitle}</h3>
                                    <button onClick={() => setEditingIndicatorModule(null)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                <div className="space-y-6">
                                    {['VALUE', 'OECD', '國語文'].map((cat) => (
                                        <div key={cat} className="space-y-2">
                                            <h4 className="text-xs font-bold uppercase tracking-wider text-indigo-700 bg-indigo-50 border-l-4 border-indigo-600 px-3 py-1.5 rounded-r">
                                                【{cat}】領域檢核指標
                                            </h4>
                                            <div className="space-y-2">
                                                {ALL_INDICATORS.filter(ind => ind.category === cat).map((ind) => {
                                                    const isChecked = editingIndicatorModule.indicators.includes(ind.id);
                                                    return (
                                                        <label
                                                            key={ind.id}
                                                            className={`flex items-start p-3 rounded-xl border cursor-pointer transition ${
                                                                isChecked ? 'bg-indigo-50 border-indigo-300' : 'bg-white border-slate-200 hover:bg-slate-50'
                                                            }`}
                                                        >
                                                            <input
                                                                type="checkbox"
                                                                checked={isChecked}
                                                                onChange={() => handleToggleIndicator(editingIndicatorModule.id, ind.id)}
                                                                className="mt-1 h-4 w-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500"
                                                            />
                                                            <div className="ml-3">
                                                                <span className="text-sm font-bold text-slate-800 block">
                                                                    {ind.title}
                                                                </span>
                                                                <span className="text-xs text-slate-500">{ind.content}</span>
                                                            </div>
                                                        </label>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div className="text-right border-t pt-3">
                                    <button onClick={() => setEditingIndicatorModule(null)} className="bg-indigo-600 text-white text-sm px-5 py-2 rounded-lg font-medium">
                                        儲存並關閉
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 教師登入 Modal */}
                    {showLoginModal && (
                        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-5 shadow-2xl relative">
                                <button onClick={() => setShowLoginModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <div className="text-center space-y-1">
                                    <div className="bg-indigo-100 text-indigo-600 w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl">
                                        <i className="fa-solid fa-user-gear"></i>
                                    </div>
                                    <h3 className="font-bold text-lg text-slate-800">教師登入編輯管理</h3>
                                    <p className="text-xs text-slate-500">登入後即可進行課程模組新增與編修</p>
                                </div>

                                {loginError && (
                                    <div className="bg-rose-50 border border-rose-200 text-rose-600 text-xs p-2.5 rounded-lg text-center">
                                        {loginError}
                                    </div>
                                )}

                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div>
                                        <label className="text-xs font-medium text-slate-700 block mb-1">教師帳號</label>
                                        <input
                                            type="text"
                                            required
                                            value={loginForm.username}
                                            onChange={(e) => setLoginForm({ ...loginForm, username: e.target.value })}
                                            placeholder="請輸入帳號 (例如: t5111)"
                                            className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs font-medium text-slate-700 block mb-1">密碼</label>
                                        <input
                                            type="password"
                                            required
                                            value={loginForm.password}
                                            onChange={(e) => setLoginForm({ ...loginForm, password: e.target.value })}
                                            placeholder="請輸入密碼"
                                            className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                        />
                                    </div>
                                    <button
                                        type="submit"
                                        className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-md"
                                    >
                                        登入編輯權限
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        function TaskEditModal({ task, isNew, onSave, onDelete, onClose }) {
            const [label, setLabel] = useState(task.label || '');
            const [url, setUrl] = useState(task.url || '');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!label.trim()) return alert('請輸入按鈕名稱');
                onSave(label, url);
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl relative">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                            <i className="fa-solid fa-xmark text-lg"></i>
                        </button>
                        <h3 className="font-bold text-base text-slate-800">
                            {isNew ? '➕ 新增學生表現任務按鈕' : '✏️ 編輯任務按鈕'}
                        </h3>

                        <form onSubmit={handleSubmit} className="space-y-4 text-xs">
                            <div>
                                <label className="font-semibold text-slate-700 block mb-1">按鈕顯示名稱（包含 Emoji）：</label>
                                <input
                                    type="text"
                                    required
                                    value={label}
                                    onChange={(e) => setLabel(e.target.value)}
                                    placeholder="例如：🕹️ 中元祭小遊戲 或 📄 學習單"
                                    className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500"
                                />
                            </div>

                            <div>
                                <label className="font-semibold text-slate-700 block mb-1">目標網址（URL）：</label>
                                <input
                                    type="url"
                                    required
                                    value={url}
                                    onChange={(e) => setUrl(e.target.value)}
                                    placeholder="https://forms.google.com/..."
                                    className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-mono focus:ring-2 focus:ring-indigo-500"
                                />
                            </div>

                            <div className="flex items-center justify-between pt-2 border-t border-slate-200">
                                <div>
                                    {!isNew && (
                                        <button
                                            type="button"
                                            onClick={onDelete}
                                            className="text-rose-500 hover:text-rose-700 font-medium px-2 py-1 rounded"
                                        >
                                            <i className="fa-solid fa-trash-can mr-1"></i>刪除按鈕
                                        </button>
                                    )}
                                </div>

                                <div className="flex space-x-2">
                                    {url && (
                                        <a
                                            href={url}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-2 rounded-lg transition border border-slate-300"
                                        >
                                            🔗 測試開啟
                                        </a>
                                    )}
                                    <button
                                        type="submit"
                                        className="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg transition shadow-sm"
                                    >
                                        完成儲存
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

        function parseEmbedUrl(input) {
            if (!input) return '';
            let raw = input.trim();
            
            // 1. 若貼上包含 iframe 的 HTML 嵌入碼
            const srcMatch = raw.match(/src=["']([^"']+)["']/);
            if (srcMatch && srcMatch[1]) {
                raw = srcMatch[1];
            }
            
            // 2. Canva 網址處理 (防止多重 /view?embed)
            if (raw.includes('canva.com/design/')) {
                let cleanUrl = raw.split('?')[0].split('#')[0];
                while (cleanUrl.endsWith('/view')) {
                    cleanUrl = cleanUrl.slice(0, -5);
                }
                return `${cleanUrl}/view?embed`;
            }

            // 3. Google 簡報處理 (自動轉為極簡純播放器)
            if (raw.includes('docs.google.com/presentation/d/')) {
                let baseUrl = raw.split('/edit')[0].split('/view')[0].split('/pub')[0].split('/embed')[0];
                return `${baseUrl}/embed?start=false&loop=false&delayms=3000`;
            }

            // 4. Google 文件處理
            if (raw.includes('docs.google.com/document/d/')) {
                let baseUrl = raw.split('/edit')[0].split('/view')[0].split('/preview')[0];
                return `${baseUrl}/preview`;
            }

            // 5. Google Drive PDF / 檔案處理
            if (raw.includes('drive.google.com/file/d/')) {
                let baseUrl = raw.split('/view')[0].split('/edit')[0];
                return `${baseUrl}/preview`;
            }

            // 6. Google Earth 3D 專案/導覽
            if (raw.includes('earth.google.com')) {
                return raw;
            }

            return raw;
        }

                                                                <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                                                <span>新分頁</span>
                                                            </a>
                                                            <button
                                                                onClick={() => {
                                                                    const elem = document.getElementById(`iframe-${mod.id}`);
                                                                    if (elem && elem.requestFullscreen) elem.requestFullscreen();
                                                                }}
                                                                className="text-xs bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-2.5 py-1.5 rounded-lg font-medium transition flex items-center space-x-1 whitespace-nowrap"
                                                            >
                                                                <i className="fa-solid fa-expand text-[10px]"></i>
                                                                <span>全螢幕</span>
                                                            </button>
                                                        </>
                                                    )}
                                                </div>
                                            </div>

                                            {/* 教師編輯當前頁籤（包含獨立儲存按鈕） */}
                                            {currentUser && currentMaterial && (
                                                <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs space-y-2">
                                                    <div className="grid grid-cols-1 sm:grid-cols-12 gap-2 items-end">
                                                        <div className="sm:col-span-4">
                                                            <label className="font-semibold text-amber-900 block mb-1">頁籤名稱：</label>
                                                            <input
                                                                type="text"
                                                                value={currentMaterial.name}
                                                                onChange={(e) => handleUpdateMaterialTab(mod.id, currentMaterial.id, 'name', e.target.value)}
                                                                className="w-full bg-white border border-amber-300 rounded px-2 py-1 text-slate-700 focus:ring-2 focus:ring-amber-500"
                                                            />
                                                        </div>
                                                        <div className="sm:col-span-6">
                                                            <label className="font-semibold text-amber-900 block mb-1">網址 / Google Earth 專案：</label>
                                                            <input
                                                                type="text"
                                                                value={currentMaterial.url}
                                                                onChange={(e) => handleUpdateMaterialTab(mod.id, currentMaterial.id, 'url', e.target.value)}
                                                                placeholder="貼上 Canva/Google 簡報/Google Earth 網址..."
                                                                className="w-full bg-white border border-amber-300 rounded px-2 py-1 font-mono text-slate-700 focus:ring-2 focus:ring-amber-500"
                                                            />
                                                        </div>
                                                        <div className="sm:col-span-2">
                                                            <button
                                                                onClick={() => saveAllModules(modules, true)}
                                                                className="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-1 px-2 rounded transition shadow-sm text-xs flex items-center justify-center space-x-1"
                                                            >
                                                                <i className="fa-solid fa-floppy-disk"></i>
                                                                <span>儲存頁籤</span>
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            {/* 教材內嵌播放容器 (支援 3D WebGL / Google Earth / 簡報) */}
                                            <div className="relative w-full aspect-video bg-slate-900 rounded-xl overflow-hidden border border-slate-300 shadow-inner">
                                                {parsedMaterialUrl ? (
                                                    <iframe
                                                        id={`iframe-${mod.id}`}
                                                        src={parsedMaterialUrl}
                                                        className="w-full h-full border-0"
                                                        allow="fullscreen; geolocation; webgl; clipboard-write; encrypted-media"
                                                        allowFullScreen
                                                    ></iframe>
                                                ) : (
                                                    <div className="flex flex-col items-center justify-center h-full text-slate-400 p-6 text-center space-y-2">
                                                        <i className="fa-solid fa-file-circle-question text-4xl"></i>
                                                        <p className="text-sm">尚未設定教材內容網址</p>
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        {}
                                        <div className="lg:col-span-5 flex flex-col justify-between space-y-6">
                                            
                                            {/* 課堂說明與任務說明 */}
                                            <div className="space-y-4">
                                                <div>
                                                    <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2 flex items-center space-x-1">
                                                        <i className="fa-solid fa-align-left text-indigo-500"></i>
                                                        <span>課程說明與導引</span>
                                                    </h3>
                                                    {currentUser ? (
                                                        <textarea
                                                            rows="4"
                                                            value={mod.description}
                                                            onChange={(e) => {
                                                                const updated = modules.map(m => m.id === mod.id ? { ...m, description: e.target.value } : m);
                                                                setModules(updated);
                                                            }}
                                                            className="w-full text-xs text-slate-700 border border-slate-300 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 leading-relaxed font-sans"
                                                        ></textarea>
                                                    ) : (
                                                        <div className="text-xs text-slate-700 leading-relaxed whitespace-pre-line bg-slate-50 p-3.5 rounded-xl border border-slate-200/60 font-sans">
                                                            {mod.description}
                                                        </div>
                                                    )}
                                                </div>

                                                {/* 學生表現任務按鈕區 */}
                                                <div>
                                                    <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2.5 flex items-center space-x-1">
                                                        <i className="fa-solid fa-[#5865F2] fa-list-check text-indigo-500"></i>
                                                        <span>學生表現任務與互動連結</span>
                                                    </h3>

                                                    <div className="flex flex-wrap gap-2.5">
                                                        {mod.tasks.map((t) => (
                                                            <div key={t.id} className="inline-block">
                                                                {currentUser ? (
                                                                    <button
                                                                        onClick={() => setEditingTaskModal({ moduleId: mod.id, task: t, isNew: false })}
                                                                        className="bg-indigo-50 hover:bg-indigo-100 text-indigo-800 border border-indigo-200 text-xs px-3.5 py-2 rounded-xl font-semibold transition flex items-center space-x-1.5 shadow-sm group"
                                                                    >
                                                                        <span>{t.label}</span>
                                                                        <i className="fa-solid fa-pen-to-square text-[10px] text-indigo-500 group-hover:scale-110 transition"></i>
                                                                    </button>
                                                                ) : (
                                                                    <a
                                                                        href={t.url}
                                                                        target="_blank"
                                                                        rel="noopener noreferrer"
                                                                        className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-4 py-2 rounded-xl font-semibold transition shadow-sm hover:shadow flex items-center space-x-1.5"
                                                                    >
                                                                        <span>{t.label}</span>
                                                                        <i className="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-70"></i>
                                                                    </a>
                                                                )}
                                                            </div>
                                                        ))}

                                                        {currentUser && (
                                                            <button
                                                                onClick={() => setEditingTaskModal({ moduleId: mod.id, task: { label: '', url: '' }, isNew: true })}
                                                                className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-2 rounded-xl font-medium border border-dashed border-slate-300 transition flex items-center space-x-1"
                                                            >
                                                                <i className="fa-solid fa-plus text-[10px]"></i>
                                                                <span>新增任務按鈕</span>
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>

                                            {/* 指標卡片區 (VALUE / OECD / 國語文) */}
                                            <div className="border-t border-slate-100 pt-4">
                                                <div className="flex items-center justify-between mb-2.5">
                                                    <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center space-x-1">
                                                        <i className="fa-solid fa-tags text-indigo-500"></i>
                                                        <span>素養與學習表現指標 ({mod.indicators.length})</span>
                                                    </h3>

                                                    {currentUser && (
                                                        <button
                                                            onClick={() => setEditingIndicatorsModal(mod.id)}
                                                            className="text-xs text-indigo-600 hover:text-indigo-800 font-medium transition flex items-center space-x-1"
                                                        >
                                                            <i className="fa-solid fa-sliders"></i>
                                                            <span>勾選指標</span>
                                                        </button>
                                                    )}
                                                </div>

                                                <div className="flex flex-wrap gap-1.5">
                                                    {mod.indicators.map((indId) => {
                                                        const target = ALL_INDICATORS.find(i => i.id === indId);
                                                        if (!target) return null;
                                                        return (
                                                            <span
                                                                key={target.id}
                                                                title={target.content}
                                                                className={`text-[11px] px-2.5 py-1 rounded-lg font-medium border ${target.tagColor} shadow-2xs transition cursor-help`}
                                                            >
                                                                {target.short}
                                                            </span>
                                                        );
                                                    })}
                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                </section>
                            );
                        })}

                        {/* 新增週次模組按紐 */}
                        {currentUser && (
                            <div className="text-center py-4">
                                <button
                                    onClick={handleAddModule}
                                    className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-2xl shadow-lg transition flex items-center space-x-2 mx-auto"
                                >
                                    <i className="fa-solid fa-plus"></i>
                                    <span>新增週次課程模組</span>
                                </button>
                            </div>
                        )}
                    </main>

                    {}
                    {editingTaskModal && (
                        <TaskEditModal
                            task={editingTaskModal.task}
                            isNew={editingTaskModal.isNew}
                            onSave={handleSaveTaskModal}
                            onDelete={handleDeleteTaskModal}
                            onClose={() => setEditingTaskModal(null)}
                        />
                    )}

                    {}
                    {editingIndicatorsModal && (
                        <IndicatorsSelectModal
                            selectedIds={modules.find(m => m.id === editingIndicatorsModal)?.indicators || []}
                            onToggle={(indId) => handleToggleIndicator(editingIndicatorsModal, indId)}
                            onClose={() => setEditingIndicatorsModal(null)}
                        />
                    )}

                    {}
                    {loginModalOpen && (
                        <LoginModal
                            onLogin={(user) => {
                                setCurrentUser(user);
                                setLoginModalOpen(false);
                                showToast('🔑 登入成功！已切換至教師編輯模式');
                            }}
                            onClose={() => setLoginModalOpen(false)}
                        />
                    )}
                </div>
            );
        }

        function TaskEditModal({ task, isNew, onSave, onDelete, onClose }) {
            const [label, setLabel] = useState(task.label || '');
            const [url, setUrl] = useState(task.url || '');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!label.trim()) return alert('請輸入按鈕名稱');
                onSave(label, url);
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl relative">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                            <i className="fa-solid fa-xmark text-lg"></i>
                        </button>
                        <h3 className="font-bold text-base text-slate-800">
                            {isNew ? '➕ 新增學生任務按鈕' : '✏️ 編輯任務按鈕'}
                        </h3>

                        <form onSubmit={handleSubmit} className="space-y-4 text-xs">
                            <div>
                                <label className="font-semibold text-slate-700 block mb-1">按鈕名稱（包含 Emoji）：</label>
                                <input
                                    type="text"
                                    required
                                    value={label}
                                    onChange={(e) => setLabel(e.target.value)}
                                    placeholder="例如：🕹️ 中元祭小遊戲 或 📄 學習單"
                                    className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500"
                                />
                            </div>

                            <div>
                                <label className="font-semibold text-slate-700 block mb-1">目標網址（URL）：</label>
                                <input
                                    type="url"
                                    required
                                    value={url}
                                    onChange={(e) => setUrl(e.target.value)}
                                    placeholder="https://forms.google.com/..."
                                    className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-mono focus:ring-2 focus:ring-indigo-500"
                                />
                            </div>

                            <div className="flex items-center justify-between pt-2 border-t border-slate-200">
                                <div>
                                    {!isNew && (
                                        <button
                                            type="button"
                                            onClick={onDelete}
                                            className="text-rose-500 hover:text-rose-700 font-medium px-2 py-1 rounded"
                                        >
                                            <i className="fa-solid fa-trash-can mr-1"></i>刪除按鈕
                                        </button>
                                    )}
                                </div>

                                <div className="flex space-x-2">
                                    {url && (
                                        <a
                                            href={url}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-2 rounded-lg transition border border-slate-300"
                                        >
                                            🔗 測試開啟
                                        </a>
                                    )}
                                    <button
                                        type="submit"
                                        className="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg transition shadow-sm"
                                    >
                                        完成儲存
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function IndicatorsSelectModal({ selectedIds, onToggle, onClose }) {
            const [activeTab, setActiveTab] = useState('VALUE');

            const filtered = ALL_INDICATORS.filter(i => i.category === activeTab);

            return (
                <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl max-w-2xl w-full p-6 space-y-4 shadow-2xl relative max-h-[85vh] flex flex-col">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                            <i className="fa-solid fa-xmark text-lg"></i>
                        </button>

                        <h3 className="font-bold text-base text-slate-800">
                            🎯 勾選當週融入之教學指標
                        </h3>

                        {/* 類別切換頁籤 */}
                        <div className="flex space-x-2 border-b border-slate-200 pb-2">
                            <button
                                onClick={() => setActiveTab('VALUE')}
                                className={`text-xs px-3 py-1.5 rounded-lg font-bold transition ${
                                    activeTab === 'VALUE' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                }`}
                            >
                                VALUE 框架 (8項)
                            </button>
                            <button
                                onClick={() => setActiveTab('OECD')}
                                className={`text-xs px-3 py-1.5 rounded-lg font-bold transition ${
                                    activeTab === 'OECD' ? 'bg-sky-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                }`}
                            >
                                OECD AI 素養 (19項)
                            </button>
                            <button
                                onClick={() => setActiveTab('國語文')}
                                className={`text-xs px-3 py-1.5 rounded-lg font-bold transition ${
                                    activeTab === '國語文' ? 'bg-rose-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                }`}
                            >
                                國語文學習表現 (17項)
                            </button>
                        </div>

                        {/* 指標選單列表 */}
                        <div className="overflow-y-auto space-y-2.5 flex-grow pr-1">
                            {filtered.map((ind) => {
                                const isChecked = selectedIds.includes(ind.id);
                                return (
                                    <div
                                        key={ind.id}
                                        onClick={() => onToggle(ind.id)}
                                        className={`p-3 rounded-xl border text-xs cursor-pointer transition flex items-start space-x-3 ${
                                            isChecked ? 'border-indigo-500 bg-indigo-50/50 shadow-2xs' : 'border-slate-200 hover:bg-slate-50'
                                        }`}
                                    >
                                        <input
                                            type="checkbox"
                                            checked={isChecked}
                                            onChange={() => {}}
                                            className="mt-0.5 rounded text-indigo-600 focus:ring-indigo-500"
                                        />
                                        <div>
                                            <p className="font-bold text-slate-800">{ind.title}</p>
                                            <p className="text-slate-600 mt-0.5 leading-relaxed">{ind.content}</p>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        <div className="pt-2 border-t border-slate-200 text-right">
                            <button
                                onClick={onClose}
                                className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-5 py-2 rounded-xl transition"
                            >
                                完成選擇
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function LoginModal({ onLogin, onClose }) {
            const [account, setAccount] = useState('');
            const [password, setPassword] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                if (account === 't5111' && password === '24567126') {
                    onLogin(account);
                } else {
                    alert('帳號或密碼錯誤！(預設帳號: t5111, 密碼: 24567126)');
                }
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl relative">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                            <i className="fa-solid fa-xmark text-lg"></i>
                        </button>

                        <div className="text-center space-y-1">
                            <h3 className="font-bold text-base text-slate-800">🔑 教師權限登入</h3>
                            <p className="text-xs text-slate-500">登入後即可即時編輯與發布課程內容</p>
                        </div>

                        <form onSubmit={handleLogin} className="space-y-3 text-xs">
                            <div>
                                <label className="font-semibold text-slate-700 block mb-1">教師帳號：</label>
                                <input
                                    type="text"
                                    required
                                    value={account}
                                    onChange={(e) => setAccount(e.target.value)}
                                    placeholder="t5111"
                                    className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500"
                                />
                            </div>

                            <div>
                                <label className="font-semibold text-slate-700 block mb-1">密碼：</label>
                                <input
                                    type="password"
                                    required
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    placeholder="••••••••"
                                    className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500"
                                />
                            </div>

                            <button
                                type="submit"
                                className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl transition shadow-sm text-xs mt-2"
                            >
                                確認登入
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

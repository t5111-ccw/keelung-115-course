<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>來去踅基隆 115 - 課程管理系統儀表板</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        html { scroll-behavior: smooth; }
        .bg-pattern {
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-pattern text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ===== 完整指標庫 (VALUE + OECD AILit) =====
        const ALL_INDICATORS = [
            // VALUE 指標
            { id: 'V1', category: 'VALUE', title: 'V1. 促進社會互動與協同學習', short: 'VALUE: 促進社會互動', tagColor: 'bg-blue-100 text-blue-800 border-blue-300', content: '【從孤立走向共構】確保科技不造成孤立，而是創造更深度的合作共構與社會互動。防範學生個人封閉或由 AI 徹底取代同儕對話。' },
            { id: 'V2', category: 'VALUE', title: 'V2. 深化後設認知與防範大腦外包', short: 'VALUE: 深化後設認知', tagColor: 'bg-emerald-100 text-emerald-800 border-emerald-300', content: '【拒絕思考代工】引導自我監控，防止學生將思考與批判過程「大腦外包」給 AI。要求提交 Prompt History 對話歷程作為評量核心。' },
            { id: 'V3', category: 'VALUE', title: 'V3. 評估探究歷程與實質回饋', short: 'VALUE: 評估探究歷程', tagColor: 'bg-amber-100 text-amber-800 border-amber-300', content: '【重視歷程，非速求答案】重視教與學的探究思考歷程，評估學生的探究與思考過程，而非僅關注快速求得的單一解答。' },
            { id: 'V4', category: 'VALUE', title: 'V4. 搭建引導思考的動態鷹架', short: 'VALUE: 搭建動態鷹架', tagColor: 'bg-purple-100 text-purple-800 border-purple-300', content: '【引導而非直給解答】動態提供認知支持，調節解題時的認知負荷，陪著學生思考，並隨能力提升使鷹架自然褪除。' },
            { id: 'V5', category: 'VALUE', title: 'V5. 釐清深層迷思與概念改變', short: 'VALUE: 釐清深層迷思', tagColor: 'bg-rose-100 text-rose-800 border-rose-300', content: '【突破深層認知盲點】透過多模態特徵（視覺化、動態模擬或 AI 強烈視覺化反例），幫助學生突破深層的認知框架與迷思概念。' },
            { id: 'V6', category: 'VALUE', title: 'V6. 連結真實情境與激發動機', short: 'VALUE: 連結真實情境', tagColor: 'bg-teal-100 text-teal-800 border-teal-300', content: '【激發內在學習熱情】賦權學生連結真實世界（如基隆郵輪與觀光發展議題），引發真實且持久的內在學習動力與可遷移性。' },
            { id: 'V7', category: 'VALUE', title: 'V7. 提供自適應的個人化路徑', short: 'VALUE: 自適應路徑', tagColor: 'bg-indigo-100 text-indigo-800 border-indigo-300', content: '【打造專屬學習節奏】提供非線性選擇，符合準備度的差異化，培養學生的自主學習能力與學習代理權（Agency）。' },
            { id: 'V8', category: 'VALUE', title: 'V8. 實踐包容設計與差異化', short: 'VALUE: 實踐包容設計', tagColor: 'bg-orange-100 text-orange-800 border-orange-300', content: '【落實 UDL 服務多元】彈性調整教學內容與產出（如錄音、繪圖、文字、Podcast），滿足不同起點學生的多元需求。' },
            // OECD AILit 指標
            { id: 'O1', category: 'OECD', title: 'OECD 1. 參與 AI (Engage with AI)', short: 'OECD: 參與 AI', tagColor: 'bg-sky-100 text-sky-800 border-sky-300', content: '【負責任參與者】辨識日常生活中 AI 角色與影響，評估 AI 產出準確度，質疑預測系統推播，並理解演算法社會偏見與資源消耗。' },
            { id: 'O2', category: 'OECD', title: 'OECD 2. 與 AI 共創 (Co-create with AI)', short: 'OECD: 與 AI 共創', tagColor: 'bg-fuchsia-100 text-fuchsia-800 border-fuchsia-300', content: '【維持人類主體性】將 AI 作為創意合作夥伴，進行多模態原型設計、腦力激盪與迭代對話，同時尊重原創智慧財產權與內容真實性。' },
            { id: 'O3', category: 'OECD', title: 'OECD 3. 管理 AI (Manage AI)', short: 'OECD: 管理 AI', tagColor: 'bg-cyan-100 text-cyan-800 border-cyan-300', content: '【意圖性人機分工】解析問題結構，決定何時自動化或增強任務，保留人類在批判判斷與領域知識的優勢，並全程監測 AI 運作品質。' },
            { id: 'O4', category: 'OECD', title: 'OECD 4. 形塑 AI (Shape AI)', short: 'OECD: 形塑 AI', tagColor: 'bg-violet-100 text-violet-800 border-violet-300', content: '【反映人類價值】調查 AI 系統侷限性，利用範例測試評價模型，調整訓練數據與設計，使 AI 系統促進社會福祉與包容性。' }
        ];

        // 初始預設課程模組
        const DEFAULT_MODULES = [
            {
                id: 'mod-1',
                weekTitle: '第 1-2 週：認識基隆與文化體驗',
                materialUrl: 'https://docs.google.com/presentation/d/e/2PACX-1vQ3-sample/embed',
                description: '課程說明：本課程為AI協作與人文地理數位敘事，課程中會認識基隆在地文史觀光資源，實地踏查，並藉由國語文寫作能力與人工智慧共創。\n\n課程要求：\n1.準時到課，每週都有課堂任務，請在下課前完成。\n2.攜帶手機，並負責任的使用AI。\n3.保持開放且愉悅的心情來冒險。',
                tasks: [
                    { id: 't1', label: '🕹️ 中元祭知識檢核遊戲', url: 'https://example.com/game1' },
                    { id: 't2', label: '📄 美食踏查紀錄表', url: 'https://docs.google.com' }
                ],
                indicators: ['V1', 'V6', 'O1']
            },
            {
                id: 'mod-2',
                weekTitle: '第 8-9 週：地理資訊與人機協作模式',
                materialUrl: 'https://docs.google.com/document/d/e/2PACX-1vQ3-sample2/embed',
                description: '建構照片地理說明，練習「人先寫 ➔ AI 描繪 ➔ 人終審」之負責任協作流程。\n\n評量核心：\n確實繳交與 AI 討論之完整對話歷程 (Prompt History)，證明具備獨立批判與審查能力。',
                tasks: [
                    { id: 't3', label: '💭 上傳對話紀錄 (Prompt History)', url: 'https://forms.google.com' },
                    { id: 't4', label: '🗺️ 地理資訊表單', url: 'https://maps.google.com' }
                ],
                indicators: ['V2', 'V3', 'V4', 'O3']
            }
        ];

        // Canva 網址處理器
        function parseEmbedUrl(input) {
            if (!input) return '';
            let raw = input.trim();
            // 1. 若貼上整段 <iframe src="..."> HTML
            const srcMatch = raw.match(/src=["']([^"']+)["']/);
            if (srcMatch && srcMatch[1]) {
                raw = srcMatch[1];
            }
            // 2. 若為 Canva 連結
            if (raw.includes('canva.com/design/')) {
                const cleanUrl = raw.split('?')[0].split('#')[0];
                return `${cleanUrl}/view?embed`;
            }
            return raw;
        }

        function App() {
            // 課程資料與使用者
            const [modules, setModules] = useState(() => {
                const saved = localStorage.getItem('keelung_course_modules');
                return saved ? JSON.parse(saved) : DEFAULT_MODULES;
            });
            const [currentUser, setCurrentUser] = useState(null); // { username: 't5111' }

            // Firebase 設定與狀態
            const [firebaseConfig, setFirebaseConfig] = useState(() => {
                const saved = localStorage.getItem('keelung_firebase_config');
                return saved ? JSON.parse(saved) : null;
            });
            const [syncStatus, setSyncStatus] = useState('local'); // 'local', 'syncing', 'synced', 'error'
            const [toastMsg, setToastMsg] = useState('');
            const dbRef = useRef(null);

            // Modals
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [showFirebaseModal, setShowFirebaseModal] = useState(false);
            const [loginForm, setLoginForm] = useState({ username: '', password: '' });
            const [loginError, setLoginError] = useState('');

            const [previewUrl, setPreviewUrl] = useState(null);
            const [selectedIndicator, setSelectedIndicator] = useState(null);
            const [editingIndicatorModule, setEditingIndicatorModule] = useState(null);

            // 1. 初始化 Firebase 監聽
            useEffect(() => {
                if (firebaseConfig && firebaseConfig.apiKey) {
                    try {
                        if (!firebase.apps.length) {
                            firebase.initializeApp(firebaseConfig);
                        }
                        const db = firebase.database();
                        dbRef.current = db.ref('keelung_115_course');

                        // 監聽即時變動
                        dbRef.current.on('value', (snapshot) => {
                            const data = snapshot.val();
                            if (data && Array.isArray(data)) {
                                setModules(data);
                                localStorage.setItem('keelung_course_modules', JSON.stringify(data));
                                setSyncStatus('synced');
                            }
                        });
                        setSyncStatus('synced');
                    } catch (err) {
                        console.error('Firebase Error:', err);
                        setSyncStatus('error');
                    }
                }
            }, [firebaseConfig]);

            // 2. 顯示 Toast 訊息
            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 3000);
            };

            // 3. 儲存至本地與 Firebase
            const saveAllModules = (newModules) => {
                setModules(newModules);
                localStorage.setItem('keelung_course_modules', JSON.stringify(newModules));

                if (dbRef.current) {
                    setSyncStatus('syncing');
                    dbRef.current.set(newModules)
                        .then(() => {
                            setSyncStatus('synced');
                            showToast('✨ 已成功發布至雲端資料庫！全世界手機皆已同步更新。');
                        })
                        .catch((err) => {
                            console.error(err);
                            setSyncStatus('error');
                            showToast('⚠️ 儲存至本機成功，但雲端同步失敗（請檢查 Firebase 設定）');
                        });
                } else {
                    showToast('💾 已儲存至此電腦快取！(欲讓學生手機看見，請設定 Firebase)');
                }
            };

            // 登入處理
            const handleLogin = (e) => {
                e.preventDefault();
                const { username, password } = loginForm;
                if ((username === 't5111' || username === 't5125') && password === '24567126') {
                    setCurrentUser({ username });
                    setShowLoginModal(false);
                    setLoginForm({ username: '', password: '' });
                    setLoginError('');
                    showToast(`🎉 歡迎登入，${username} 老師！現已取得管理編輯權限。`);
                } else {
                    setLoginError('帳號或密碼錯誤！(試用: t5111 / 24567126)');
                }
            };

            // 新增模組
            const handleAddModule = () => {
                const newId = `mod-${Date.now()}`;
                const newModule = {
                    id: newId,
                    weekTitle: `第 ${modules.length + 1} 模組：新課程進度主題`,
                    materialUrl: 'https://docs.google.com/presentation/d/e/2PACX-1vQ3-sample/embed',
                    description: '課程說明：請在此輸入本週課程活動簡述...\n\n表現任務：請在此說明學生應完成之目標。',
                    tasks: [
                        { id: `t-${Date.now()}`, label: '📝 新任務按紐', url: 'https://google.com' }
                    ],
                    indicators: ['V1', 'O1']
                };
                const updated = [...modules, newModule];
                saveAllModules(updated);
                setTimeout(() => {
                    document.getElementById(newId)?.scrollIntoView({ behavior: 'smooth' });
                }, 150);
            };

            // 刪除模組
            const handleDeleteModule = (id) => {
                if (confirm('確定要刪除此課程模組嗎？')) {
                    const updated = modules.filter(m => m.id !== id);
                    saveAllModules(updated);
                }
            };

            // 修改欄位
            const handleUpdateModule = (id, field, value) => {
                const updated = modules.map(m => m.id === id ? { ...m, [field]: value } : m);
                saveAllModules(updated);
            };

            // 新增任務按鈕
            const handleAddTask = (moduleId) => {
                const label = prompt('請輸入任務按鈕名稱（如：🕹️ 遊戲檢核）：', '新任務按鈕');
                if (!label) return;
                const url = prompt('請貼上任務目標網址：', 'https://');
                if (!url) return;

                const updated = modules.map(m => {
                    if (m.id === moduleId) {
                        return {
                            ...m,
                            tasks: [...m.tasks, { id: `task-${Date.now()}`, label, url }]
                        };
                    }
                    return m;
                });
                saveAllModules(updated);
            };

            // 刪除任務按鈕
            const handleDeleteTask = (moduleId, taskId) => {
                const updated = modules.map(m => {
                    if (m.id === moduleId) {
                        return {
                            ...m,
                            tasks: m.tasks.filter(t => t.id !== taskId)
                        };
                    }
                    return m;
                });
                saveAllModules(updated);
            };

            // 勾選/取消指標
            const handleToggleIndicator = (moduleId, indId) => {
                const updated = modules.map(m => {
                    if (m.id === moduleId) {
                        const exists = m.indicators.includes(indId);
                        const nextInds = exists
                            ? m.indicators.filter(i => i !== indId)
                            : [...m.indicators, indId];
                        return { ...m, indicators: nextInds };
                    }
                    return m;
                });
                saveAllModules(updated);
            };

            return (
                <div className="pb-24">
                    {/* 頂部通知 Toast */}
                    {toastMsg && (
                        <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white text-sm px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-2 animate-bounce border border-slate-700">
                            <span>{toastMsg}</span>
                        </div>
                    )}

                    {/* 頂部導航列 Header */}
                    <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="bg-indigo-600 text-white p-2 rounded-lg shadow-md">
                                    <i className="fa-solid fa-graduation-cap text-xl"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-slate-800 text-lg leading-tight flex items-center space-x-2">
                                        <span>來去踅基隆 115</span>
                                        {dbRef.current ? (
                                            <span className="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-medium border border-emerald-300">
                                                <i className="fa-solid fa-cloud mr-1"></i>雲端已同步
                                            </span>
                                        ) : (
                                            <span className="text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-medium border border-amber-300">
                                                <i className="fa-solid fa-hard-drive mr-1"></i>本機儲存中
                                            </span>
                                        )}
                                    </h1>
                                    <p className="text-xs text-slate-500">課程管理系統儀表板</p>
                                </div>
                            </div>

                            {/* 右側工具列 */}
                            <div className="flex items-center space-x-3">
                                {/* 下拉選單 */}
                                <select
                                    onChange={(e) => {
                                        if (e.target.value) {
                                            document.getElementById(e.target.value)?.scrollIntoView({ behavior: 'smooth' });
                                        }
                                    }}
                                    className="bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer"
                                >
                                    <option value="">🎯 切換單元進度...</option>
                                    {modules.map((m) => (
                                        <option key={m.id} value={m.id}>{m.weekTitle}</option>
                                    ))}
                                </select>

                                {/* 登入與 Firebase 按扭 */}
                                {currentUser ? (
                                    <div className="flex items-center space-x-2 bg-indigo-50 border border-indigo-200 px-3 py-1.5 rounded-lg">
                                        <span className="text-xs text-indigo-700 font-medium mr-1">
                                            <i className="fa-solid fa-user-shield mr-1"></i>
                                            {currentUser.username} 老師
                                        </span>
                                        <button
                                            onClick={() => setShowFirebaseModal(true)}
                                            className="text-xs bg-white hover:bg-slate-50 text-slate-600 border border-slate-300 px-2 py-1 rounded shadow-sm"
                                            title="Firebase 雲端設定"
                                        >
                                            <i className="fa-solid fa-cloud-gear text-indigo-600 mr-1"></i>雲端設定
                                        </button>
                                        <button
                                            onClick={handleAddModule}
                                            className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-2.5 py-1 rounded transition shadow-sm font-medium"
                                        >
                                            <i className="fa-solid fa-plus mr-1"></i>新增模組
                                        </button>
                                        <button
                                            onClick={() => setCurrentUser(null)}
                                            className="text-xs text-slate-400 hover:text-rose-600 px-1"
                                            title="登出"
                                        >
                                            <i className="fa-solid fa-right-from-bracket"></i>
                                        </button>
                                    </div>
                                ) : (
                                    <button
                                        onClick={() => setShowLoginModal(true)}
                                        className="bg-slate-800 hover:bg-slate-900 text-white text-sm px-4 py-1.5 rounded-lg shadow transition flex items-center space-x-1.5"
                                    >
                                        <i className="fa-solid fa-lock text-xs"></i>
                                        <span>教師登入</span>
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* 主要內容區 */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 space-y-12">
                        {modules.length === 0 && (
                            <div className="text-center py-20 bg-white rounded-2xl border border-slate-200 shadow-sm">
                                <p className="text-slate-500">目前尚無課程模組，請教師登入後點擊「新增模組」。</p>
                            </div>
                        )}

                        {modules.map((mod, index) => {
                            const parsedMaterialUrl = parseEmbedUrl(mod.materialUrl);
                            return (
                                <section
                                    key={mod.id}
                                    id={mod.id}
                                    className="bg-white rounded-2xl border border-slate-200 shadow-md overflow-hidden transition-all hover:shadow-lg relative"
                                >
                                    {/* 模組 Header */}
                                    <div className="bg-slate-50 border-b border-slate-200 px-6 py-4 flex justify-between items-center">
                                        <div className="flex-1 mr-4">
                                            {currentUser ? (
                                                <input
                                                    type="text"
                                                    value={mod.weekTitle}
                                                    onChange={(e) => handleUpdateModule(mod.id, 'weekTitle', e.target.value)}
                                                    className="w-full font-bold text-lg text-indigo-900 bg-white border border-slate-300 rounded px-2.5 py-1 focus:ring-2 focus:ring-indigo-500"
                                                />
                                            ) : (
                                                <h2 className="font-bold text-lg text-slate-800 flex items-center">
                                                    <span className="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-0.5 rounded-full mr-2">
                                                        模組 {index + 1}
                                                    </span>
                                                    {mod.weekTitle}
                                                </h2>
                                            )}
                                        </div>

                                        {currentUser && (
                                            <button
                                                onClick={() => handleDeleteModule(mod.id)}
                                                className="text-rose-500 hover:text-rose-700 text-xs px-2.5 py-1 rounded hover:bg-rose-50 transition"
                                            >
                                                <i className="fa-solid fa-trash-can mr-1"></i>刪除模組
                                            </button>
                                        )}
                                    </div>

                                    {/* 雙欄內容 */}
                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 p-6">
                                        
                                        {/* 左欄：嵌入教材 (7 欄) */}
                                        <div className="lg:col-span-7 flex flex-col space-y-3">
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                                    <i className="fa-solid fa-book-open mr-1.5 text-indigo-500"></i>核心教材內容
                                                </span>
                                                <div className="flex space-x-2">
                                                    <a
                                                        href={parsedMaterialUrl}
                                                        target="_blank"
                                                        rel="noreferrer"
                                                        className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 px-2.5 py-1 rounded transition flex items-center space-x-1"
                                                    >
                                                        <i className="fa-solid fa-arrow-up-right-from-square"></i>
                                                        <span>新分頁開啟</span>
                                                    </a>
                                                    <button
                                                        onClick={() => setPreviewUrl(parsedMaterialUrl)}
                                                        className="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border border-indigo-200 px-2.5 py-1 rounded transition flex items-center space-x-1 font-medium"
                                                    >
                                                        <i className="fa-solid fa-expand"></i>
                                                        <span>全螢幕放大</span>
                                                    </button>
                                                </div>
                                            </div>

                                            {/* 網址編輯框 (教師) */}
                                            {currentUser && (
                                                <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs space-y-1.5">
                                                    <label className="font-semibold text-amber-900 block">
                                                        <i className="fa-solid fa-link mr-1"></i>編輯核心教材網址或 HTML 嵌入碼：
                                                    </label>
                                                    <input
                                                        type="text"
                                                        value={mod.materialUrl}
                                                        onChange={(e) => handleUpdateModule(mod.id, 'materialUrl', e.target.value)}
                                                        placeholder="可直接貼上 Canva 嵌入碼、Canva 網址或 Google 簡報內嵌網址..."
                                                        className="w-full bg-white border border-amber-300 rounded px-2.5 py-1.5 font-mono text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500"
                                                    />
                                                    <p className="text-[11px] text-amber-700 leading-tight">
                                                        💡 貼心提醒：Canva 簡報請點擊「分享 ➔ 嵌入 ➔ 複製 HTML 嵌入代碼」直接貼入上框，系統會自動轉換為完美顯示！
                                                    </p>
                                                </div>
                                            )}

                                            {/* Iframe 視窗 */}
                                            <div className="w-full h-[380px] bg-slate-100 rounded-xl overflow-hidden border border-slate-200 shadow-inner relative">
                                                <iframe
                                                    src={parsedMaterialUrl}
                                                    className="w-full h-full border-0"
                                                    title={`Material for ${mod.weekTitle}`}
                                                    allowFullScreen
                                                ></iframe>
                                            </div>
                                        </div>

                                        {/* 右欄：課程說明與任務 (5 欄) */}
                                        <div className="lg:col-span-5 flex flex-col justify-between space-y-6">
                                            
                                            {/* 上半：週進度說明與任務 */}
                                            <div className="space-y-4">
                                                <div className="space-y-2">
                                                    <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider block">
                                                        <i className="fa-solid fa-bullseye mr-1.5 text-rose-500"></i>週進度課程說明 & 表現任務
                                                    </span>

                                                    {currentUser ? (
                                                        <textarea
                                                            rows="5"
                                                            value={mod.description}
                                                            onChange={(e) => handleUpdateModule(mod.id, 'description', e.target.value)}
                                                            className="w-full border border-slate-300 rounded-lg p-3 text-sm leading-relaxed text-slate-700 focus:ring-2 focus:ring-indigo-500 font-sans"
                                                            placeholder="請輸入活動內涵與表現任務 (支援分行與段落)..."
                                                        />
                                                    ) : (
                                                        /* whitespace-pre-line 確保換行正常顯示 */
                                                        <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm leading-relaxed text-slate-700 whitespace-pre-line shadow-inner">
                                                            {mod.description}
                                                        </div>
                                                    )}
                                                </div>

                                                {/* 任務按鈕列表 */}
                                                <div className="space-y-2">
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-xs font-medium text-slate-600">學生表現任務按鈕：</span>
                                                        {currentUser && (
                                                            <button
                                                                onClick={() => handleAddTask(mod.id)}
                                                                className="text-xs text-indigo-600 hover:text-indigo-800 font-medium"
                                                            >
                                                                <i className="fa-solid fa-plus mr-1"></i>新增任務按鈕
                                                            </button>
                                                        )}
                                                    </div>

                                                    <div className="flex flex-wrap gap-2">
                                                        {mod.tasks.map((task) => (
                                                            <div key={task.id} className="inline-flex items-center">
                                                                <a
                                                                    href={task.url}
                                                                    target="_blank"
                                                                    rel="noreferrer"
                                                                    className="bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-indigo-700 text-xs font-medium px-3 py-1.5 rounded-lg shadow-sm transition flex items-center space-x-1.5"
                                                                >
                                                                    <span>{task.label}</span>
                                                                    <i className="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-70"></i>
                                                                </a>
                                                                {currentUser && (
                                                                    <button
                                                                        onClick={() => handleDeleteTask(mod.id, task.id)}
                                                                        className="ml-1 text-slate-400 hover:text-rose-500 text-xs p-1"
                                                                        title="刪除按鈕"
                                                                    >
                                                                        <i className="fa-solid fa-xmark"></i>
                                                                    </button>
                                                                )}
                                                            </div>
                                                        ))}
                                                        {mod.tasks.length === 0 && (
                                                            <span className="text-xs text-slate-400 italic">尚無設定任務按鈕</span>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>

                                            {/* 下半：VALUE & OECD 檢核指標 */}
                                            <div className="border-t border-slate-200 pt-4 space-y-2">
                                                <div className="flex justify-between items-center">
                                                    <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider flex items-center">
                                                        <i className="fa-solid fa-clipboard-check mr-1.5 text-emerald-600"></i>
                                                        VALUE 與 OECD 檢核指標
                                                    </span>
                                                    {currentUser && (
                                                        <button
                                                            onClick={() => setEditingIndicatorModule(mod)}
                                                            className="text-xs text-indigo-600 hover:underline font-medium"
                                                        >
                                                            <i className="fa-solid fa-pen-to-square mr-1"></i>修改勾選指標
                                                        </button>
                                                    )}
                                                </div>

                                                {/* 指標標籤列表 */}
                                                <div className="flex flex-wrap gap-1.5">
                                                    {mod.indicators.map((indId) => {
                                                        const ind = ALL_INDICATORS.find(p => p.id === indId);
                                                        if (!ind) return null;
                                                        return (
                                                            <button
                                                                key={ind.id}
                                                                onClick={() => setSelectedIndicator(ind)}
                                                                className={`text-xs px-2.5 py-1 rounded-md border font-medium transition cursor-pointer hover:opacity-80 shadow-sm ${ind.tagColor}`}
                                                            >
                                                                <i className="fa-solid fa-circle-info mr-1 text-[10px]"></i>
                                                                {ind.short}
                                                            </button>
                                                        );
                                                    })}
                                                    {mod.indicators.length === 0 && (
                                                        <span className="text-xs text-slate-400 italic">未對應檢核指標</span>
                                                    )}
                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                </section>
                            );
                        })}
                    </main>

                    {/* ===== Modals ===== */}

                    {/* 1. 全螢幕預覽 Modal */}
                    {previewUrl && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-6xl h-[85vh] flex flex-col overflow-hidden shadow-2xl">
                                <div className="bg-slate-800 text-white px-6 py-3 flex justify-between items-center">
                                    <span className="text-sm font-medium"><i className="fa-solid fa-expand mr-2"></i>教材全螢幕預覽視窗</span>
                                    <button onClick={() => setPreviewUrl(null)} className="text-slate-400 hover:text-white text-lg">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                <div className="flex-1 bg-slate-900">
                                    <iframe src={previewUrl} className="w-full h-full border-0" title="Full preview"></iframe>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 2. 指標內涵 Modal */}
                    {selectedIndicator && (
                        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl relative">
                                <button onClick={() => setSelectedIndicator(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <div className="flex items-center space-x-2">
                                    <span className="bg-indigo-100 text-indigo-800 text-xs px-2.5 py-1 rounded font-bold">
                                        {selectedIndicator.category} 指標內涵
                                    </span>
                                </div>
                                <h3 className="text-base font-bold text-slate-800">
                                    {selectedIndicator.title}
                                </h3>
                                <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm text-slate-700 leading-relaxed whitespace-pre-line">
                                    {selectedIndicator.content}
                                </div>
                                <div className="text-right">
                                    <button onClick={() => setSelectedIndicator(null)} className="bg-slate-800 hover:bg-slate-900 text-white text-xs px-4 py-2 rounded-lg">
                                        關閉說明
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 3. 教師勾選指標 Modal */}
                    {editingIndicatorModule && (
                        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-2xl w-full p-6 space-y-4 shadow-2xl max-h-[85vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="font-bold text-slate-800">勾選 VALUE 與 OECD 指標 - {editingIndicatorModule.weekTitle}</h3>
                                    <button onClick={() => setEditingIndicatorModule(null)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>
                                <div className="space-y-3">
                                    {ALL_INDICATORS.map((ind) => {
                                        const isChecked = editingIndicatorModule.indicators.includes(ind.id);
                                        return (
                                            <label
                                                key={ind.id}
                                                className={`flex items-start p-3 rounded-xl border cursor-pointer transition ${
                                                    isChecked ? 'bg-indigo-50 border-indigo-300' : 'bg-white border-slate-200 hover:bg-slate-50'
                                                }`}
                                            >
                                                <input
                                                    type="checkbox"
                                                    checked={isChecked}
                                                    onChange={() => handleToggleIndicator(editingIndicatorModule.id, ind.id)}
                                                    className="mt-1 h-4 w-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500"
                                                />
                                                <div className="ml-3">
                                                    <span className="text-sm font-bold text-slate-800 block">
                                                        [{ind.category}] {ind.title}
                                                    </span>
                                                    <span className="text-xs text-slate-500">{ind.content}</span>
                                                </div>
                                            </label>
                                        );
                                    })}
                                </div>
                                <div className="text-right border-t pt-3">
                                    <button onClick={() => setEditingIndicatorModule(null)} className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-5 py-2 rounded-lg font-medium">
                                        儲存並關閉
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 4. Firebase 設定 Modal */}
                    {showFirebaseModal && (
                        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl relative">
                                <button onClick={() => setShowFirebaseModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <div className="text-center space-y-1">
                                    <div className="bg-emerald-100 text-emerald-600 w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl">
                                        <i className="fa-solid fa-cloud-bolt"></i>
                                    </div>
                                    <h3 className="font-bold text-lg text-slate-800">Firebase 雲端同步設定</h3>
                                    <p className="text-xs text-slate-500">將你的專案金鑰貼入下方，全世界學生手機即可即時同步看見最新內容！</p>
                                </div>

                                <textarea
                                    rows="6"
                                    placeholder='請貼上 Firebase Config JSON 物件，例如：&#10;{&#10;  "apiKey": "AIzaSy...",&#10;  "authDomain": "...",&#10;  "databaseURL": "https://...",&#10;  "projectId": "..."&#10;}'
                                    value={firebaseConfig ? JSON.stringify(firebaseConfig, null, 2) : ''}
                                    onChange={(e) => {
                                        try {
                                            const parsed = JSON.parse(e.target.value);
                                            setFirebaseConfig(parsed);
                                            localStorage.setItem('keelung_firebase_config', JSON.stringify(parsed));
                                        } catch (err) {
                                            // 允許自由輸入
                                        }
                                    }}
                                    className="w-full font-mono text-xs border border-slate-300 rounded-lg p-3 bg-slate-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                />

                                <div className="flex justify-between items-center text-xs text-slate-500">
                                    <span>未設定時將自動退回本機儲存模式。</span>
                                    <button
                                        onClick={() => {
                                            setShowFirebaseModal(false);
                                            showToast('已完成 Firebase 金鑰設定！');
                                        }}
                                        className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium"
                                    >
                                        完成儲存
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 5. 教師登入 Modal */}
                    {showLoginModal && (
                        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-5 shadow-2xl relative">
                                <button onClick={() => setShowLoginModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <div className="text-center space-y-1">
                                    <div className="bg-indigo-100 text-indigo-600 w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl">
                                        <i className="fa-solid fa-user-gear"></i>
                                    </div>
                                    <h3 className="font-bold text-lg text-slate-800">教師登入編輯管理</h3>
                                    <p className="text-xs text-slate-500">登入後即可進行課程模組新增與編修</p>
                                </div>

                                {loginError && (
                                    <div className="bg-rose-50 border border-rose-200 text-rose-600 text-xs p-2.5 rounded-lg text-center">
                                        {loginError}
                                    </div>
                                )}

                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div>
                                        <label className="text-xs font-medium text-slate-700 block mb-1">教師帳號</label>
                                        <input
                                            type="text"
                                            required
                                            value={loginForm.username}
                                            onChange={(e) => setLoginForm({ ...loginForm, username: e.target.value })}
                                            placeholder="請輸入帳號 (例如: t5111)"
                                            className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs font-medium text-slate-700 block mb-1">密碼</label>
                                        <input
                                            type="password"
                                            required
                                            value={loginForm.password}
                                            onChange={(e) => setLoginForm({ ...loginForm, password: e.target.value })}
                                            placeholder="請輸入密碼"
                                            className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                        />
                                    </div>
                                    <button
                                        type="submit"
                                        className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-md"
                                    >
                                        登入編輯權限
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
